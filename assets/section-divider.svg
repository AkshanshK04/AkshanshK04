<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 32" width="100%" height="32">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#557C73" stop-opacity="0" />
      <stop offset="25%" stop-color="#557C73" stop-opacity="0.4" />
      <stop offset="45%" stop-color="#C79A55" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#C79A55" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#557C73" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#557C73" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#263D32" stop-opacity="0" />
      <stop offset="35%" stop-color="#557C73" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#E8E1D1" stop-opacity="1" />
      <stop offset="65%" stop-color="#557C73" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#263D32" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Base Stratum Line -->
  <line x1="20" y1="16" x2="880" y2="16" stroke="url(#divGrad)" stroke-width="1" />

  <!-- Digital Clock Pulse Waveform in Center -->
  <path d="M 360 16 
           L 410 16 
           L 415 6 
           L 435 6 
           L 440 26 
           L 460 26 
           L 465 16 
           L 490 16" 
        fill="none" stroke="url(#pulseGrad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Diamond Specimen Node -->
  <g transform="translate(450, 16)">
    <polygon points="0,-5 5,0 0,5 -5,0" fill="#C79A55" stroke="#101513" stroke-width="1" />
    <circle cx="0" cy="0" r="1.5" fill="#E8E1D1" />
  </g>

  <!-- Left/Right Flanking Measurement Ticks -->
  <g stroke="#557C73" stroke-width="1" opacity="0.6">
    <line x1="280" y1="12" x2="280" y2="20" />
    <line x1="320" y1="14" x2="320" y2="18" />
    <line x1="580" y1="14" x2="580" y2="18" />
    <line x1="620" y1="12" x2="620" y2="20" />
  </g>

  <!-- Micro-datum Text -->
  <text x="325" y="24" font-family="ui-monospace, monospace" font-size="6.5" fill="#A69B85" letter-spacing="1">STRATUM: 95 Ma</text>
  <text x="575" y="24" font-family="ui-monospace, monospace" font-size="6.5" fill="#A69B85" text-anchor="end" letter-spacing="1">CYCLE // 16-BIT</text>
</svg>
